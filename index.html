<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>La Silla</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Map viewport: fixed window, image pans inside it -->
    <div id="viewport">
      <div id="map">
        <!-- Shows placeholder by default. Put your real map at assets/map.png and
           change src to "assets/map.png" (it falls back to placeholder if missing). -->
        <img
          id="map-image"
          src="assets/map.png"
          alt="Mapa"
          draggable="false"
          onerror="
            this.onerror = null;
            this.src = 'assets/placeholder.svg';
          "
        />
        <!-- circles get injected here by app.js -->
        <div id="circles-layer"></div>
        <!-- Tooltip lives INSIDE the map so it pans together with its circle -->
        <div id="tooltip" class="hidden">
          <div id="tooltip-content"></div>
        </div>
      </div>
    </div>

    <!-- Floating button to open the creator -->
    <button id="open-sidebar" title="Crear círculo">+ Crear</button>

    <!-- Sidebar modal: create a circle -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h2>Nuevo círculo</h2>
        <button id="close-sidebar" title="Cerrar">×</button>
      </div>

      <form id="circle-form">
        <!-- Live preview of the marker (color only for now; swap for "chais" later) -->
        <div id="circle-preview-wrap">
          <span id="circle-preview" class="circle-preview"></span>
        </div>

        <fieldset id="color-group">
          <legend>Color del círculo</legend>
          <label class="swatch" style="--c: #e63946"
            ><input type="radio" name="color" value="#e63946" checked
          /></label>
          <label class="swatch" style="--c: #f3722c"
            ><input type="radio" name="color" value="#f3722c"
          /></label>
          <label class="swatch" style="--c: #f9c74f"
            ><input type="radio" name="color" value="#f9c74f"
          /></label>
          <label class="swatch" style="--c: #90be6d"
            ><input type="radio" name="color" value="#90be6d"
          /></label>
          <label class="swatch" style="--c: #43aa8b"
            ><input type="radio" name="color" value="#43aa8b"
          /></label>
          <label class="swatch" style="--c: #577590"
            ><input type="radio" name="color" value="#577590"
          /></label>
          <label class="swatch" style="--c: #277da1"
            ><input type="radio" name="color" value="#277da1"
          /></label>
          <label class="swatch" style="--c: #9b5de5"
            ><input type="radio" name="color" value="#9b5de5"
          /></label>
          <label class="swatch" style="--c: #f15bb5"
            ><input type="radio" name="color" value="#f15bb5"
          /></label>
          <label class="swatch" style="--c: #1d3557"
            ><input type="radio" name="color" value="#1d3557"
          /></label>
        </fieldset>

        <label>
          Tipo de contenido
          <select id="media-type">
            <option value="text">Texto</option>
            <option value="image">Imagen</option>
            <option value="video">Video</option>
          </select>
        </label>

        <!-- Text input (shown for "text") -->
        <label id="text-field">
          Texto
          <textarea
            id="text-content"
            rows="4"
            placeholder="Escribe algo..."
          ></textarea>
        </label>

        <!-- File input (shown for "image"/"video") -->
        <label id="file-field" class="hidden">
          Archivo
          <input type="file" id="media-file" accept="image/*" />
        </label>

        <button type="submit" id="submit-circle">
          Crear y soltar en el mapa
        </button>
        <p id="form-status"></p>
      </form>
    </aside>

    <!-- Supabase client from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Your Supabase keys (copy config.example.js -> config.js and fill in) -->
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
