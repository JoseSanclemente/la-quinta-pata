<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mapa Imaginario</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Map viewport: fixed window, image pans inside it -->
  <div id="viewport">
    <div id="map">
      <!-- Shows placeholder by default. Put your real map at assets/map.png and
           change src to "assets/map.png" (it falls back to placeholder if missing). -->
      <img id="map-image" src="assets/placeholder.svg" alt="Mapa" draggable="false"
           onerror="this.onerror=null;this.src='assets/placeholder.svg';" />
      <!-- circles get injected here by app.js -->
      <div id="circles-layer"></div>
    </div>
  </div>

  <!-- Floating button to open the creator -->
  <button id="open-sidebar" title="Crear círculo">+ Crear círculo</button>

  <!-- Sidebar modal: create a circle -->
  <aside id="sidebar" class="hidden">
    <div class="sidebar-header">
      <h2>Nuevo círculo</h2>
      <button id="close-sidebar" title="Cerrar">×</button>
    </div>

    <form id="circle-form">
      <label>
        Color del círculo
        <input type="color" id="color" value="#e63946" />
      </label>

      <label>
        Tipo de contenido
        <select id="media-type">
          <option value="text">Texto</option>
          <option value="image">Imagen</option>
          <option value="video">Video</option>
        </select>
      </label>

      <!-- Text input (shown for "text") -->
      <label id="text-field">
        Texto
        <textarea id="text-content" rows="4" placeholder="Escribe algo..."></textarea>
      </label>

      <!-- File input (shown for "image"/"video") -->
      <label id="file-field" class="hidden">
        Archivo
        <input type="file" id="media-file" accept="image/*" />
      </label>

      <button type="submit" id="submit-circle">Crear y soltar en el mapa</button>
      <p id="form-status"></p>
    </form>
  </aside>

  <!-- Tooltip: shows a circle's media when clicked -->
  <div id="tooltip" class="hidden">
    <button id="close-tooltip" title="Cerrar">×</button>
    <div id="tooltip-content"></div>
  </div>

  <!-- Supabase client from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Your Supabase keys (copy config.example.js -> config.js and fill in) -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
